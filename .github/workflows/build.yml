name: Build APK

on:
  push:
    branches: [ main, master, dev ]
    paths-ignore:
      - 'docs/**'
      - 'playstore/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK and Play Store bundle
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/Docora.apk
          cp app/build/outputs/bundle/release/*.aab out/Docora-playstore.aab

      - name: Check 16 KB page-size support
        run: |
          mkdir -p chk && cd chk && unzip -q ../out/Docora.apk 'lib/*'
          bad=0
          for f in lib/arm64-v8a/*.so lib/x86_64/*.so; do
            [ -f "$f" ] || continue
            a=$(readelf -lW "$f" | awk '/LOAD/{print $NF}' | sort -u | head -1)
            echo "$a  $f"
            if [ $((a)) -lt 16384 ]; then bad=1; fi
          done
          [ $bad -eq 0 ] || { echo "Some native libraries are not 16 KB aligned"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Docora
          path: out/*

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Docora build ${{ github.run_number }}
          make_latest: true
          files: |
            out/Docora.apk
            out/Docora-playstore.aab
