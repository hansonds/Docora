name: Build APK

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK and Play Store bundle
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/Docora.apk
          cp app/build/outputs/bundle/release/*.aab out/Docora-playstore.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Docora
          path: out/*

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Docora build ${{ github.run_number }}
          make_latest: true
          files: |
            out/Docora.apk
            out/Docora-playstore.aab
